<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to Golinks</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: auto; }
  body { padding: 16px 18px 0; background: var(--panel); }
  /* Actions stay visible at the bottom however small the popup is; the form scrolls above them. */
  #form .actions {
    position: sticky; bottom: 0; z-index: 5; margin: 12px -18px 0; padding: 10px 18px 12px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #notes { min-height: 56px; }
  h1 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .url { font-size: 12px; color: var(--muted); word-break: break-all; margin: -2px 0 8px; }
  .done { text-align: center; padding: 60px 10px; }
  .done b { font-size: 18px; display: block; margin-bottom: 8px; }
  .shot-edit img, .shot-edit .none { aspect-ratio: 16 / 7; max-height: 34vh; }
</style>
</head>
<body>
<div id="form">
  <h1><img src="/favicon.svg" alt=""> Add to Golinks</h1>
  <div class="url" id="url"></div>
  <div id="info"></div>
  <div id="pageDetails" class="page-details hidden"></div>
  <div class="field"><label>Snapshot<span class="info" tabindex="0" data-tip="Where the thumbnail comes from. The service screenshots your own browser window (works for SSO pages). Auto refresh tries the page preview image, then headless Chrome for public pages, then a tile.">i</span></label><div class="shot-edit" id="shot"><div class="none"><span class="spin"></span>&nbsp; capturing the browser window</div></div><div class="help" id="shotMsg"></div></div>
  <div class="field"><label>Title<span class="info" tabindex="0" data-tip="Name shown in lists and matched first by search. Defaults to the page title.">i</span></label><input type="text" id="title"></div>
  <div class="field"><label>Tags<span class="info" tabindex="0" data-tip="Short labels for filtering (click a tag in the sidebar) and search (tag:name). Rules add some automatically. Type a tag and press Enter or comma.">i</span></label><div id="tags"></div></div>
  <div class="row2">
    <div class="field"><label>Go keyword<span class="info" tabindex="0" data-tip="Unique short name for the Chrome address bar: type &quot;:go name&quot; to open this link instantly. Letters, digits, dots and dashes.">i</span></label><input type="text" id="keyword" placeholder="optional"><div class="sug hidden" id="sugKeywords"></div></div>
    <div class="field"><label>Folder<span class="info" tabindex="0" data-tip="Optional folder this link lives in. Use / for nesting, for example Work/Projects. Typing a new path creates the folder.">i</span></label><div id="folder"></div><div class="sug hidden" id="sugFolders"></div></div>
  </div>
  <div class="field"><label>Notes<span class="info" tabindex="0" data-tip="Your own notes, searched. The bookmarklet puts the text you had selected on the page here.">i</span></label><textarea id="notes"></textarea></div>
  <div class="actions">
    <button class="btn primary" id="save">Save <kbd>&#8984;&#8629;</kbd></button>
    <button class="btn" id="cancel">Cancel</button>
    <span id="status" class="small muted"></span>
  </div>
</div>
<div id="done" class="done hidden"></div>
<script src="/chips.js"></script>
<script src="/folderpick.js"></script>
<script src="/suggestui.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const qs = new URLSearchParams(location.search);
  const url = qs.get('url') || '';
  const image = qs.get('image') || '';
  $('#url').textContent = url;
  $('#title').value = qs.get('title') || '';
  $('#notes').value = qs.get('selection') || '';
  const description = qs.get('description') || '';
  let page = null;
  try { page = JSON.parse(qs.get('meta') || 'null'); } catch { page = null; }
  const chips = chipEditor($('#tags'), {});
  const folderPick = folderPicker($('#folder'), { placeholder: 'No folder' });

  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || res.statusText); e.data = data; e.status = res.status; throw e; }
    return data;
  }

  let captured = null;
  async function captureWindow() {
    try {
      const r = await api('POST', '/api/capture', { url, open: false });
      captured = r.snapshot;
      $('#shot').innerHTML = '<img src="' + captured + '" alt="">';
      $('#shotMsg').textContent = 'Screenshot taken from ' + r.app + '.';
    } catch (err) {
      captured = null;
      $('#shot').innerHTML = '<div class="none">no screenshot</div>';
      $('#shotMsg').textContent = err.message + (image ? ' The page image will be used instead.' : ' A tile will be used instead.');
    }
  }

  async function init() {
    if (!url) { $('#info').innerHTML = '<div class="alert error">No URL given. Use the bookmarklet from a page.</div>'; return; }
    captureWindow();
    try {
      const [meta, info] = await Promise.all([api('GET', '/api/meta'), api('POST', '/api/enrich', { url, fetch: false, title: $('#title').value, page })]);
      chips.setAll(meta.tags.map((t) => t.name));
      chips.set(info.tags);
      folderPick.setFolders(meta.folders);
      showSuggestions(info.suggest, info.duplicate);
      if (info.duplicate) $('#info').innerHTML = '<div class="alert warn">Already saved as "' + esc(info.duplicate.title) + '". Saving will update tags and notes on the existing link.</div>';
      window.__dup = info.duplicate;
    } catch (err) {
      $('#info').innerHTML = '<div class="alert error">' + esc(err.message) + '</div>';
    }
    $('#title').focus();
    $('#title').select();
  }

  // Suggestion chips: tags feed the chip editor, folders set the picker, keywords fill the field.
  function showSuggestions(sug, dup) {
    const items = suggestItems(sug);
    chips.setSuggestions(items.tags.map((t) => t.value));
    suggestChips($('#sugFolders'), items.folders, { label: 'Suggested', onPick: (it) => folderPick.set(it.value) });
    if (!dup) suggestChips($('#sugKeywords'), items.keywords, { label: 'Suggested', onPick: (it) => { $('#keyword').value = it.value; } });
    const line = suggestDetailsLine(sug && sug.details);
    const pd = $('#pageDetails');
    if (line) {
      pd.classList.remove('hidden');
      pd.innerHTML = esc(line) + ' <button type="button" class="btn sm ghost" id="addDetails">Add to notes</button>';
      $('#addDetails').onclick = () => { const n = $('#notes'); n.value = (n.value ? n.value + '\n' : '') + line; pd.classList.add('hidden'); };
    }
  }

  async function save() {
    $('#save').disabled = true;
    $('#status').innerHTML = '<span class="spin"></span>';
    try {
      const body = { url, title: $('#title').value, tags: chips.get(), keyword: $('#keyword').value, folder: folderPick.get(), notes: $('#notes').value, description, snapshot: captured || undefined, snapshotUrl: image || undefined, source: 'bookmarklet', enrich: false };
      let link;
      if (window.__dup) {
        const d = window.__dup;
        const merged = { title: body.title || d.title, tags: [...new Set([...(d.tags || []), ...body.tags])], keyword: body.keyword || d.keyword, folder: body.folder || d.folder, notes: [d.notes, body.notes].filter(Boolean).join('\n') };
        link = (await api('PUT', '/api/links/' + d.id, merged)).link;
        if (captured) link = (await api('POST', '/api/links/' + d.id + '/snapshot', { snapshot: captured })).link;
      } else {
        link = (await api('POST', '/api/links', body)).link;
      }
      $('#form').classList.add('hidden');
      const d = $('#done');
      d.classList.remove('hidden');
      d.innerHTML = '<b>Saved</b><div class="muted">' + esc(link.title) + '</div><div class="small muted" style="margin-top:14px">This window closes in a moment.</div>';
      setTimeout(() => window.close(), 1200);
    } catch (err) {
      $('#save').disabled = false;
      $('#status').textContent = err.message;
    }
  }

  $('#save').onclick = save;
  $('#cancel').onclick = () => window.close();
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') window.close();
  });
  init();
})();
</script>
</body>
</html>
